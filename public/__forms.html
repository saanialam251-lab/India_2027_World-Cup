<!-- Static copy of the squad form so Netlify detects it at build time. -->
<html>
  <body>
    <form name="squad-submission" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="squad-submission" />
      <input name="subject" />
      <input name="name" />
      <input name="email" />
      <input name="captain" />
      <input name="vice_captain" />
      <input name="wicket_keeper" />
      <textarea name="squad"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
